# ---------------------------------------------------------------------------
# Output definitions.
#
# frequency: added at 4000Hz (up from ESPHome's ~1kHz ledc default) to reduce
# visible flicker / audible coil whine on typical LED driver hardware. Raise
# further (e.g. 8-19kHz) if your specific driver supports it and you still see
# flicker on camera or hear noise.
#
# STRAPPING PINS - verified against PCB/16ch-v1 KiCad schematic + PCB files:
# GPIO2 (ch8), GPIO12 (ch5), and GPIO15 (ch7) each connect to exactly one
# other point on the board: the gate of a dedicated 2N7002K N-channel MOSFET
# (SOT-23, one per channel, Q6 for ch4's neighbor etc.) that switches that
# channel's LED string to ground. There is no external pull-up/pull-down
# resistor on any of these three gate nets, and no other component shares
# the net. A MOSFET gate is a capacitive load only (no DC path), so it can't
# out-fight the ESP32's own internal strapping pull during reset - meaning
# these three pins should boot the same way they would completely unloaded.
# ignore_strapping_warning is set below to suppress ESPHome's build-time
# warning now that this has been checked against the actual hardware net
# list, not just assumed safe.
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    pin: GPIO25
    id: output_ch1
    frequency: 4000Hz
  - platform: ledc
    pin: GPIO26
    id: output_ch2
    frequency: 4000Hz
  - platform: ledc
    pin: GPIO27
    id: output_ch3
    frequency: 4000Hz
  - platform: ledc
    pin: GPIO14
    id: output_ch4
    frequency: 4000Hz
  - platform: ledc
    pin:
      number: GPIO12
      ignore_strapping_warning: true  # verified safe - see note above
    id: output_ch5
    frequency: 4000Hz
  - platform: ledc
    pin: GPIO13
    id: output_ch6
    frequency: 4000Hz
  - platform: ledc
    pin:
      number: GPIO15
      ignore_strapping_warning: true  # verified safe - see note above
    id: output_ch7
    frequency: 4000Hz
  - platform: ledc
    pin:
      number: GPIO2
      ignore_strapping_warning: true  # verified safe - see note above
    id: output_ch8
    frequency: 4000Hz
  - platform: ledc
    pin: GPIO4
    id: output_ch9
    frequency: 4000Hz
  - platform: ledc
    pin: GPIO16
    id: output_ch10
    frequency: 4000Hz
  - platform: ledc
    pin: GPIO17
    id: output_ch11
    frequency: 4000Hz
  - platform: ledc
    pin: 
      number: GPIO5
      ignore_strapping_warning: true  # verified safe - see note above
    id: output_ch12
    frequency: 4000Hz
  - platform: ledc
    pin: GPIO18
    id: output_ch13
    frequency: 4000Hz
  - platform: ledc
    pin: GPIO19
    id: output_ch14
    frequency: 4000Hz
  - platform: ledc
    pin: GPIO21
    id: output_ch15
    frequency: 4000Hz
  - platform: ledc
    pin: GPIO22
    id: output_ch16
    frequency: 4000Hz
