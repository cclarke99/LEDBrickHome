substitutions:
  name: "office-lego-wall-shelf"
  friendly_name: LEDBrickHome
  project_name: SenseAtHome.ledbrickhome-16ch
  project_version: '1.0'

esphome:
  name: ${name}
  name_add_mac_suffix: false
  project:
    name: ${project_name}
    version: ${project_version}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: recommended
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:
  level: INFO  # DEBUG floods logs / adds flash wear on a shipped device; drop to DEBUG only while troubleshooting

api:
  # Generate a real key per device: `esphome secrets` or `openssl rand -base64 32`
  # Without this, anyone on the network can send API commands to the device.
  #encryption:
    #key: !secret api_encryption_key

ota:
  - platform: esphome
    # Without a password, anyone on the network can push new firmware.
    #password: !secret ota_password

wifi:
  # NOTE: fast_connect skips scanning and connects straight to the stored BSSID/channel.
  # If your SSID actually is hidden, you generally want fast_connect OFF so the device
  # still scans and finds it; fast_connect is really for speeding up connects to a
  # known, visible AP. Double check this matches what "hidden_ssid" is meant to do.
  fast_connect: true
  ssid: !secret wifi_ssid
  password: !secret wifi_password

web_server:
  port: 80

improv_serial:

esp32_improv:
  authorizer: none

binary_sensor:
  - platform: status
    name: "${friendly_name} Status"

sensor:
  - platform: uptime
    name: "${friendly_name} Uptime"
    disabled_by_default: true

button:
  - platform: restart
    id: restart_button
    name: "${friendly_name} Restart"
  - platform: factory_reset
    name: "${friendly_name} Factory Reset"
  # Removed the duplicate `switch: platform: factory_reset` that was also in the
  # original file. A switch is stateful and can be flipped/restored unexpectedly
  # (e.g. by a restore_mode or automation); a momentary button is the safer choice
  # for a destructive action, so this button is now the single source for it.

time:
  - platform: sntp

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      disabled_by_default: true

# ---------------------------------------------------------------------------
# Reusable effects list. Anchored once here (&channel_effects) and referenced
# on every channel below (<<: *channel_effects) instead of being retyped 16
# times. Adjust flicker intensity etc. in ONE place.
# ---------------------------------------------------------------------------
.effects_anchor: &channel_effects
  effects:
    - pulse:
    - flicker:
        intensity: 10%
    - strobe:

light:
# Details for each of the outputs.
# see https://esphome.io/components/light/index.html#light-effects for configuration
# of light effects
#
# restore_mode is set explicitly below (ALWAYS_OFF) so channels never snap back
# to a prior brightness after a power cycle. Change to RESTORE_DEFAULT_OFF if you
# want it to remember the last state instead.

# Group 1:
# to use RGB light, uncomment its section and comment out the three monochromatic
# lights in this group
